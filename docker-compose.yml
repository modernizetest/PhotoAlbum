services:
  # Migrated from Oracle to PostgreSQL according to SQL check item 1 and Property check item 1: Replace Oracle Database service with PostgreSQL service.
  # PostgreSQL Database service (for local development; production uses Azure Database for PostgreSQL with Managed Identity)
  postgres-db:
    image: postgres:15
    container_name: photoalbum-postgres
    environment:
      - POSTGRES_DB=photoalbum
      - POSTGRES_USER=photoalbum
      - POSTGRES_PASSWORD=photoalbum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql-init:/docker-entrypoint-initdb.d
    networks:
      - photoalbum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoalbum -d photoalbum"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Photo Album Java Application
  photoalbum-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoalbum-java-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PGHOST=postgres-db
      - PGPORT=5432
      - PGDATABASE=photoalbum
      # NOTE: This docker-compose is for local development with a traditional PostgreSQL container.
      # The application-docker.properties uses Azure Managed Identity authentication (AzurePostgresqlAuthenticationPlugin),
      # which requires a real Azure managed identity and will fail against the local postgres container.
      # For true local development without Azure, override spring.datasource.url with a plain JDBC URL:
      #   e.g., SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/photoalbum
      # and provide SPRING_DATASOURCE_USERNAME/PASSWORD (matching POSTGRES_USER/POSTGRES_PASSWORD above).
      # In Azure (Container Apps), set MANAGED_IDENTITY_NAME and MANAGED_IDENTITY_CLIENT_ID instead.
      - MANAGED_IDENTITY_NAME=photoalbum
      - MANAGED_IDENTITY_CLIENT_ID=
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - photoalbum-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  photoalbum-network:
    driver: bridge