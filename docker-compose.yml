services:
  # Migrated from Oracle to PostgreSQL according to SQL check item 1 and Property check item 1: Replace Oracle Database service with PostgreSQL service.
  # PostgreSQL Database service (for local development; production uses Azure Database for PostgreSQL with Managed Identity)
  postgres-db:
    image: postgres:15
    container_name: photoalbum-postgres
    environment:
      - POSTGRES_DB=photoalbum
      - POSTGRES_USER=photoalbum
      - POSTGRES_PASSWORD=photoalbum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql-init:/docker-entrypoint-initdb.d
    networks:
      - photoalbum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoalbum -d photoalbum"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Photo Album Java Application
  photoalbum-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoalbum-java-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PGHOST=postgres-db
      - PGPORT=5432
      - PGDATABASE=photoalbum
      # For local development only - in Azure use Managed Identity (set MANAGED_IDENTITY_NAME and MANAGED_IDENTITY_CLIENT_ID)
      - MANAGED_IDENTITY_NAME=photoalbum
      - MANAGED_IDENTITY_CLIENT_ID=
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - photoalbum-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  photoalbum-network:
    driver: bridge